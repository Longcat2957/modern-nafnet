[project]
name = "modern-nafnet"
version = "0.1.0"
description = "NAFNet deblurring training and ONNX deployment tools"
readme = "README.md"
authors = [
    { name = "Longcat2957", email = "schrodingers030@gmail.com" }
]
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
modern-nafnet = "modern_nafnet.cli:main"

[project.optional-dependencies]
train = [
    "albumentationsx[headless]==2.5.1",
    "torch==2.14.1",
]
qat = [
    "albumentationsx[headless]==2.5.1",
    "huggingface-hub>=2.2.0",
    "nvidia-modelopt==0.47.0",
    # ModelOpt 0.47 imports requests in torch.utils without declaring it in base dependencies.
    "requests>=2.34.2",
    "torch==2.14.1",
]
export = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "torch==2.14.1",
]
metrics = [
    "torchmetrics==1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reference: compares against the bundled pinned upstream snapshot",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/reference"] # Preserve the unmodified upstream test oracle.

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "onnxruntime>=1.31.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
